<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<meta name="description" content="Full-stack engineer portfolio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<a class="skip-link" href="#hero">Skip to content</a>

<header class="topbar">
  <nav class="nav" aria-label="Primary">
    <a href="#hero" class="nav-brand" id="navBrand">Portfolio</a>

    <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navLinks" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>

    <ul class="nav-links" id="navLinks">
      <li><a href="#about">About</a></li>
      <li><a href="#experience">Experience</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#skills">Skills</a></li>
      <li><a href="#education">Education</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle light and dark theme">
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" fill="currentColor"/></svg>
    </button>
  </nav>
</header>

<main id="app">

  <!-- HERO -->
  <section id="hero" class="section hero">
    <div class="container hero-grid">
      <div class="hero-copy">
        <p class="eyebrow" id="heroRole">Loading…</p>
        <h1 id="heroName"></h1>
        <p class="hero-tagline" id="heroTagline"></p>
        <div class="hero-actions">
          <a href="#contact" class="btn btn-primary">Get in touch</a>
          <a href="resume.html" class="btn btn-ghost" id="resumePageBtn">View Résumé</a>
          <a href="assets/resume/resume.pdf" class="btn btn-ghost" id="resumeBtn" download>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 19h14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Download PDF
          </a>
        </div>
        <div class="hero-stats" id="heroStats"></div>
      </div>
      <div class="hero-panel glass" aria-hidden="true">
        <div class="panel-row"><span></span><span></span><span></span></div>
        <div class="panel-line" style="width:70%"></div>
        <div class="panel-line" style="width:92%"></div>
        <div class="panel-line" style="width:55%"></div>
        <div class="panel-code" id="heroPanelCode"></div>
      </div>
    </div>
  </section>

  <!-- ABOUT / SUMMARY -->
  <section id="about" class="section">
    <span id="summary" class="anchor-alias"></span>
    <div class="container">
      <h2 class="section-title">About</h2>
      <div class="about-grid">
        <div class="about-text" id="aboutText"></div>
        <div class="about-highlights glass" id="aboutHighlights"></div>
      </div>
    </div>
  </section>

  <!-- EXPERIENCE -->
  <section id="experience" class="section">
    <div class="container">
      <h2 class="section-title">Experience</h2>
      <div class="timeline" id="experienceList"></div>
    </div>
  </section>

  <!-- PROJECTS -->
  <section id="projects" class="section">
    <div class="container">
      <h2 class="section-title">Projects</h2>
      <div class="card-grid" id="projectsList"></div>
    </div>
  </section>

  <!-- SKILLS -->
  <section id="skills" class="section">
    <div class="container">
      <h2 class="section-title">Skills</h2>
      <div class="skills-grid" id="skillsList"></div>
    </div>
  </section>

  <!-- EDUCATION -->
  <section id="education" class="section">
    <div class="container">
      <h2 class="section-title">Education</h2>
      <div class="timeline" id="educationList"></div>
    </div>
  </section>

  <!-- CONTACT -->
  <section id="contact" class="section">
    <div class="container">
      <div class="contact-card glass">
        <h2 class="section-title" id="contactHeading">Let's build something</h2>
        <p id="contactMessage"></p>
        <div class="contact-links" id="contactLinks"></div>
      </div>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="container footer-inner">
    <span id="footerName"></span>
    <span class="footer-dot">·</span>
    <span>Built with vanilla HTML/CSS/JS</span>
  </div>
</footer>

<script src="assets/js/main.js"></script>
</body>
</html>
